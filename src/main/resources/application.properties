# ===============================================
# A. JDBC Connection (Verified Correct)
# ===============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BikeParkingDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=BikeParkingUser
spring.datasource.password=StrongP@ssword123!
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================================
# B. HIBERNATE/JPA Naming Overrides (The Fix)
# ===============================================

# 1. DISABLE validation (Allows app to start even if schema issues persist)
spring.jpa.hibernate.ddl-auto=none

# 2. FORCE the exact schema name (Overrides automatic lowercasing)
spring.jpa.properties.hibernate.default_schema=BikeParking

# 3. FORCE the exact catalog (database) name
spring.jpa.properties.hibernate.default_catalog=BikeParkingDB

# 4. Use the standard naming strategy (Disables Spring Boot's automatic snake_casing)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================================
# C. JWT Configuration
# ===============================================
jwt.secret=your-super-secret-key-min-256-bits-change-this-in-production-use-environment-variable
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# ===============================================
# D. Logging Configuration
# ===============================================
# Logging level for the application
logging.level.com.bikeparking.backend=INFO
logging.level.com.bikeparking.backend.filter.RequestResponseLoggingFilter=INFO

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Enable request/response logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ===============================================
# E. HTTPS Configuration
# ===============================================
server.ssl.key-store=classpath:certs/bike-parking.p12
server.ssl.key-store-password=123123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bike-parking
server.port=8443

# Optional: HTTP redirect port (if you want HTTP on 8080 to redirect to HTTPS)
server.http.port=8080
